name: Heartbreaker map check

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install
        run: yarn --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Simulate Heartbreaker only
        run: |
          sed -i 's/for (let m = 0; m < stages.length; m++)/for (let m = stages.length - 1; m < stages.length; m++)/g' scripts/simulate.ts
          echo "=== seed 1 ==="
          yarn simulate bench 6,16,30,100
          sed -i 's/seed: 1/seed: 7/g' scripts/simulate.ts
          echo "=== seed 7 ==="
          yarn simulate bench 6,16,30,100
          sed -i 's/seed: 7/seed: 19/g' scripts/simulate.ts
          echo "=== seed 19 ==="
          yarn simulate bench 6,16,30,100
